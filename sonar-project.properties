# SonarQube analysis config — binds this checkout to the same project the
# SonarLint IDE integration uses (.vscode/settings.json → projectKey
# `gundestrup_knowledge-base-mcp-server`). Driven by .github/workflows/sonar.yml.
#
# Required CI secret: SONAR_TOKEN.
# Self-hosted SonarQube Server instead of SonarQube Cloud: remove
# `sonar.organization` below and add a SONAR_HOST_URL repository secret.
sonar.projectKey=gundestrup_knowledge-base-mcp-server
sonar.organization=gundestrup

sonar.sources=src
sonar.tests=src
# test-support includes the *-corpus.ts fixtures: deliberate fake secrets and
# injection payloads for the redaction/injection scanners — excluded so secret
# rules don't flag them as real credentials (SonarCloud secrets:S6334/S6418).
sonar.exclusions=src/**/*.test.ts,src/**/__fixtures__/**,src/**/__property-tests__/**,src/test-support/**,src/e2e/**
sonar.test.inclusions=src/**/*.test.ts
# The corpus fixtures also fall under sonar.tests=src scope, which
# sonar.exclusions does not cover — exclude them there too so the fake
# secrets stay unanalyzed on both axes.
sonar.test.exclusions=src/test-support/**

# `jest --coverage` (v8 provider) writes coverage/lcov.info — see jest.config.js.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Reviewed suppressions for deliberate/dev-tooling code:
#  - test-support corpora contain intentional fake secrets for the scanners
#  - leaderboard-template emits <th> via generated {{*_HEAD}} blocks
#  - benchmark Python scripts are operator-run dev tooling; CLI-arg paths are
#    additionally guarded by _resolve_path/_safe_name containment checks
sonar.issue.ignore.multicriteria=corpusSecrets,corpusCreds,corpusPwd,leaderboardTh,benchPyTraverse,benchPyArgv
sonar.issue.ignore.multicriteria.corpusSecrets.ruleKey=secrets:S6334
sonar.issue.ignore.multicriteria.corpusSecrets.resourceKey=src/test-support/**
sonar.issue.ignore.multicriteria.corpusCreds.ruleKey=typescript:S6418
sonar.issue.ignore.multicriteria.corpusCreds.resourceKey=src/test-support/**
sonar.issue.ignore.multicriteria.corpusPwd.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.corpusPwd.resourceKey=src/test-support/**
sonar.issue.ignore.multicriteria.leaderboardTh.ruleKey=Web:S5256
sonar.issue.ignore.multicriteria.leaderboardTh.resourceKey=benchmarks/compare/leaderboard-template.html
sonar.issue.ignore.multicriteria.benchPyTraverse.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.benchPyTraverse.resourceKey=benchmarks/**/*.py
sonar.issue.ignore.multicriteria.benchPyArgv.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.benchPyArgv.resourceKey=benchmarks/**/*.py
